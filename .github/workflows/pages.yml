
name: Atualizar cotações e publicar Radar ETFs

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Obter cotações (falhar se atualização diária não resultar)
        shell: bash
        run: |
          if ! python scripts/update_market.py; then
            if [[ "${{ github.event_name }}" == "push" ]]; then
              echo "Publicação inicial sem dados: a interface indicará sem sinais."
            else
              echo "Sem atualização fidedigna: não publicar dados novos nem substituir a versão anterior."
              exit 1
            fi
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
