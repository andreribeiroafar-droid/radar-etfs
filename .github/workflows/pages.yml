
name: Atualizar cotações e publicar Radar ETFs

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validar segurança do Forex Autopilot
        run: python -m unittest discover -s tests -p 'test_autopilot.py' -v

      - name: Validar investigação ETF
        run: python -m unittest discover -s tests -p 'test_etf_research.py' -v

      - name: Atualizar cotações
        run: python scripts/update_market.py

      - name: Avaliar estratégias ETF historicamente (sem ordens)
        run: python scripts/etf_research.py

      - name: Executar simulação Forex sem ordens reais
        run: python scripts/forex_autopilot.py

      - name: Guardar cotações e diário de simulação
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/forex_autopilot.json data/strategy_research.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update market snapshot and Forex observation ledger [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
