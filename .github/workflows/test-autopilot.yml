
name: Test Forex Autopilot v4.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/forex_autopilot.py'
      - 'tests/test_autopilot.py'
      - '.github/workflows/test-autopilot.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run safety tests
        run: python -m unittest discover -s tests -p 'test_autopilot.py' -v
